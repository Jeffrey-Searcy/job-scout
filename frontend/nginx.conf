# nginx serves the built React SPA and reverse-proxies API calls to Django.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown routes return index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API to the backend service on the compose network. We forward the
    # original Host so Django sees the real origin (CSRF/Origin checks depend on
    # it). This stack always runs behind the Tailscale HTTPS proxy, which
    # terminates TLS and forwards to us, so we PIN X-Forwarded-Proto to https
    # rather than echoing the client's header. Echoing $http_x_forwarded_proto
    # would let a client that reaches nginx directly spoof the scheme Django
    # trusts (via SECURE_PROXY_SSL_HEADER) — so we set the literal instead.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Resume PDFs can be a few MB; allow uploads comfortably above the app's
        # own 5 MB cap so the app's validation (not nginx) is what rejects big files.
        client_max_body_size 10m;
    }

    # NOTE: nginx does NOT serve /media/ resume PDFs. They are private per user
    # and their URLs are guessable, so serving them here would leak one user's
    # resume to anyone on the tailnet. All resume downloads go through Django,
    # which checks the login (owner) or the worker secret first:
    #   - GET /api/resume/pdf/                     (browser, owner only)
    #   - GET /api/worker/tasks/<id>/resume.pdf    (worker, shared secret)
}
