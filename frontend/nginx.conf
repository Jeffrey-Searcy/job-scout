# nginx serves the built React SPA and reverse-proxies API calls to Django.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown routes return index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API to the backend service on the compose network.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
